<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置</title>
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <div class="settings-panel">
    <div class="settings-header">
      <h3>设置</h3>
      <button class="close-btn" id="closeBtn">&times;</button>
    </div>
    <div class="settings-body">
      <div class="setting-item">
        <label>保存路径</label>
        <div class="path-input-group">
          <input type="text" id="savePathInput" readonly>
          <button id="browseBtn">浏览</button>
        </div>
        <div class="path-history" id="pathHistory">
          <span class="path-history-label">历史路径：</span>
          <div class="path-history-list" id="pathHistoryList"></div>
        </div>
      </div>
      <div class="setting-item">
        <button class="primary-btn" id="saveBtn">保存设置</button>
      </div>
    </div>
  </div>
  <script src="scripts/settings.js"></script>
</body>
</html>
