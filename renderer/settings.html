<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置</title>
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <div class="settings-window" id="settingsWindow">
    <header class="settings-header" id="settingsHeader">
      <div class="settings-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>设置</span>
      </div>
      <button class="settings-close" id="settingsClose" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <nav class="settings-nav" id="settingsNav">
      <button class="nav-item active" data-tab="appearance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="13.5" cy="6.5" r="2.5"></circle>
          <circle cx="17.5" cy="10.5" r="2.5"></circle>
          <circle cx="8.5" cy="7.5" r="2.5"></circle>
          <circle cx="6.5" cy="12.5" r="2.5"></circle>
          <path d="M12 2A10 10 0 1 0 12 22"></path>
        </svg>
        <span>外观</span>
      </button>
      <button class="nav-item" data-tab="general">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>常规</span>
      </button>
      <button class="nav-item" data-tab="icons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>图标</span>
      </button>
      <button class="nav-item" data-tab="about">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>关于</span>
      </button>
    </nav>

    <main class="settings-body">
      <section class="settings-tab active" data-tab="appearance">
        <div class="section-title">Dock 外观</div>
        <div class="preview-area">
          <div class="preview-dock" id="previewDock">
            <div class="preview-dock-icon"></div>
            <div class="preview-dock-icon"></div>
            <div class="preview-dock-icon"></div>
          </div>
        </div>

        <div class="setting-item">
          <span>模糊模式</span>
          <div class="blur-mode-options" id="blurModeOptions">
            <button class="blur-mode-opt active" data-mode="glass">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                <path d="M3 12h18"></path>
              </svg>
              <span>玻璃</span>
            </button>
            <button class="blur-mode-opt" data-mode="gaussian">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9"></circle>
                <circle cx="12" cy="12" r="5"></circle>
                <circle cx="12" cy="12" r="1.5"></circle>
              </svg>
              <span>高斯</span>
            </button>
            <button class="blur-mode-opt" data-mode="acrylic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
              </svg>
              <span>亚克力</span>
            </button>
            <button class="blur-mode-opt" data-mode="custom">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 7v5l3 3"></path>
              </svg>
              <span>自定义</span>
            </button>
          </div>
        </div>

        <!-- 自定义模式参数（仅自定义模式可调） -->
        <div class="mode-params" id="customParams" style="display:none;">
          <div class="slider-item">
            <div class="slider-label">
              <span>模糊强度</span>
              <span class="slider-value" id="customBlurValue">40px</span>
            </div>
            <input type="range" class="slider" id="settingCustomBlur" min="0" max="100" value="40">
          </div>
          <div class="slider-item">
            <div class="slider-label">
              <span>背景透明度</span>
              <span class="slider-value" id="customOpacityValue">50%</span>
            </div>
            <input type="range" class="slider" id="settingCustomOpacity" min="0" max="100" value="50">
          </div>
        </div>

        <div class="slider-item">
          <div class="slider-label">
            <span>圆角大小</span>
            <span class="slider-value" id="radiusValue">24px</span>
          </div>
          <input type="range" class="slider" id="settingRadius" min="0" max="40" value="24">
        </div>

        <div class="slider-item">
          <div class="slider-label">
            <span>图标大小</span>
            <span class="slider-value" id="iconSizeValue">52px</span>
          </div>
          <input type="range" class="slider" id="settingIconSize" min="36" max="72" value="52">
        </div>

        <div class="slider-item">
          <div class="slider-label">
            <span>显示图标数量</span>
            <span class="slider-value" id="itemCountValue">8</span>
          </div>
          <input type="range" class="slider" id="settingItemCount" min="8" max="10" value="8">
        </div>

        <div class="color-item">
          <span>主题色</span>
          <div class="color-options" id="colorOptions">
            <button class="color-opt active" data-color="#1e1e1e" style="background:#1e1e1e"></button>
            <button class="color-opt" data-color="#2d2d2d" style="background:#2d2d2d"></button>
            <button class="color-opt" data-color="#003366" style="background:#003366"></button>
            <button class="color-opt" data-color="#3a1c71" style="background:#3a1c71"></button>
            <button class="color-opt" data-color="#0f3443" style="background:#0f3443"></button>
            <div class="color-picker-wrap">
              <input type="color" id="customColorPicker" value="#1e1e1e" class="color-picker">
              <span class="color-picker-label">自定义</span>
            </div>
          </div>
        </div>

        <div class="section-title" style="margin-top:20px">Dock 布局</div>
        <label class="toggle-item">
          <div class="toggle-text">
            <div class="toggle-title">仅显示快捷图标</div>
            <div class="toggle-desc">隐藏开始按钮和托盘图标（音量/网络/电量/时间/设置/关闭），Dock 仅保留快捷方式区</div>
          </div>
          <input type="checkbox" id="settingOnlyShortcuts" class="toggle-switch">
          <span class="toggle-slider"></span>
        </label>
      </section>

      <section class="settings-tab" data-tab="general">
        <div class="section-title">窗口行为</div>
        <label class="toggle-item">
          <div class="toggle-text">
            <div class="toggle-title">始终置顶</div>
            <div class="toggle-desc">Dock 窗口保持在所有窗口最上层</div>
          </div>
          <input type="checkbox" id="settingAlwaysOnTop" class="toggle-switch">
          <span class="toggle-slider"></span>
        </label>

        <label class="toggle-item">
          <div class="toggle-text">
            <div class="toggle-title">隐藏系统任务栏</div>
            <div class="toggle-desc">激活 Dock 时自动隐藏 Windows 任务栏</div>
          </div>
          <input type="checkbox" id="settingHideSystemTaskbar" class="toggle-switch">
          <span class="toggle-slider"></span>
        </label>

        <div class="section-title">位置</div>
        <div class="action-row">
          <button class="action-btn" id="btnResetDockPos">重置 Dock 位置</button>
          <button class="action-btn" id="btnCenterDock">居中 Dock</button>
        </div>
      </section>

      <section class="settings-tab" data-tab="icons">
        <div class="section-title">图标管理</div>
        <p class="hint-text">拖拽应用或文件到 Dock 栏即可添加图标。右键 Dock 图标可隐藏或删除。</p>
        <div class="action-row">
          <button class="action-btn primary" id="btnResetIcons">重置为默认图标</button>
          <button class="action-btn" id="btnShowHidden">显示已隐藏图标</button>
        </div>
        <div class="section-title">图标列表</div>
        <div class="icon-list" id="iconList">
          <div class="empty-tip">正在加载...</div>
        </div>
      </section>

      <section class="settings-tab" data-tab="about">
        <div class="about-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <h1 class="about-name">浮窗文件管理</h1>
        <p class="about-version">版本 1.1.0</p>
        <p class="about-desc">基于 Electron 的桌面浮窗文件管理器，集成 Dock 导航栏。</p>
        <div class="about-links">
          <a class="about-link" data-action="open-config">打开配置文件夹</a>
        </div>
      </section>
    </main>

    <footer class="settings-footer">
      <button class="footer-btn" id="btnApply">应用</button>
      <button class="footer-btn primary" id="btnOK">确定</button>
    </footer>
  </div>

  <script src="scripts/settings.js"></script>
</body>
</html>
