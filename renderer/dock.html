<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dock</title>
    <link rel="stylesheet" href="styles/dock.css" />
  </head>
  <body>
    <div class="dock-container" id="dockContainer">
      <!-- 音量浮层 -->
      <div class="dock-popup volume-popup" id="volumePopup" hidden>
        <div class="popup-volume-row">
          <button class="popup-mute-btn" id="popupMuteBtn" title="静音">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>
          <div class="popup-volume-slider-wrap">
            <input
              type="range"
              min="0"
              max="100"
              value="50"
              class="popup-volume-slider"
              id="popupVolumeSlider"
            />
            <span class="popup-volume-value" id="popupVolumeValue">50</span>
          </div>
        </div>
      </div>

      <!-- 网络浮层（有线+无线） -->
      <div class="dock-popup wifi-popup" id="wifiPopup" hidden>
        <div class="wifi-header">
          <span class="wifi-title">网络</span>
          <button class="wifi-refresh-btn" id="wifiRefreshBtn" title="刷新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
        </div>
        <!-- 有线连接状态 -->
        <div class="wifi-status wired-status" id="wiredStatus" hidden>
          <div class="wifi-status-row wired">
            <div class="wifi-status-icon wired-icon" id="wiredStatusIcon"></div>
            <div class="wifi-status-info">
              <div class="wifi-status-ssid" id="wiredStatusName">有线连接</div>
              <div class="wifi-status-signal" id="wiredStatusIp"></div>
            </div>
          </div>
        </div>
        <div class="wifi-divider" id="wiredDivider" hidden></div>
        <!-- 无线连接状态 -->
        <div class="wifi-status" id="wifiStatus">
          <div class="wifi-status-row">
            <div class="wifi-status-icon" id="wifiStatusIcon"></div>
            <div class="wifi-status-info">
              <div class="wifi-status-ssid" id="wifiStatusSsid">未连接</div>
              <div class="wifi-status-signal" id="wifiStatusSignal"></div>
            </div>
            <button class="wifi-disconnect-btn" id="wifiDisconnectBtn" hidden>断开</button>
          </div>
        </div>
        <div class="wifi-divider"></div>
        <div class="wifi-list" id="wifiList">
          <div class="wifi-empty">点击右上角刷新按钮扫描网络</div>
        </div>
      </div>

      <div class="dock-panel" id="dockPanel">
        <!-- 玻璃效果由 ::before 伪元素提供，独立模糊层与图标完全分离 -->
        <!-- 开关机按钮 -->
        <div class="dock-power" data-nav-action="power" title="关机/重启">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </div>
        <!-- 开始按钮 -->
        <div class="dock-start" data-nav-action="start" title="开始">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="9" height="9" rx="1" fill="#0078D4" />
            <rect x="13" y="2" width="9" height="9" rx="1" fill="#107C10" />
            <rect x="2" y="13" width="9" height="9" rx="1" fill="#FFB900" />
            <rect x="13" y="13" width="9" height="9" rx="1" fill="#E81123" />
          </svg>
        </div>
        <div class="dock-separator"></div>
        <div class="dock-items-wrapper" id="dockItemsWrapper">
          <button class="dock-scroll-btn left" id="scrollLeft" title="向左滚动">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="dock-items" id="dockItems">
            <div class="dock-items-inner" id="dockItemsInner"></div>
          </div>
          <button class="dock-scroll-btn right" id="scrollRight" title="向右滚动">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
        <div class="dock-separator"></div>
        <div class="dock-tray">
          <div class="dock-tray-item" data-nav-action="wifi" title="网络">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
              <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
              <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
              <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
          </div>
          <div class="dock-tray-item" data-nav-action="volume" title="音量">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </div>
          <div class="dock-tray-item" data-nav-action="battery" id="dockBattery" title="电源">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect>
              <line x1="22" y1="11" x2="22" y2="13"></line>
            </svg>
            <span class="tray-text" id="batteryText"></span>
          </div>
          <div class="dock-tray-item" id="dockTime" title="时间"></div>
          <div class="dock-tray-item dock-settings-btn" id="dockSettings" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
          </div>
          <div class="dock-tray-item dock-close" id="dockClose" title="关闭Dock">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script src="scripts/dock.js"></script>
  </body>
</html>
