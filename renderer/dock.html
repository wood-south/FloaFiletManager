<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dock</title>
  <link rel="stylesheet" href="styles/dock.css">
</head>
<body>
  <div class="dock-container" id="dockContainer">
    <div class="dock-panel" id="dockPanel">
      <div class="dock-start" data-nav-action="start" title="开始">
        <svg viewBox="0 0 24 24" fill="#0078d4">
          <path d="M0 0h12v12H0z"/><path d="M12 0h12v12H12z" fill="#107c10"/><path d="M0 12h12v12H0z" fill="#ffb900"/><path d="M12 12h12v12H12z" fill="#e81123"/>
        </svg>
      </div>
      <div class="dock-separator"></div>
      <div class="dock-items" id="dockItems"></div>
      <div class="dock-separator"></div>
      <div class="dock-tray">
        <div class="dock-tray-item" data-nav-action="wifi" title="网络">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line>
          </svg>
        </div>
        <div class="dock-tray-item" data-nav-action="volume" title="音量">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </div>
        <div class="dock-tray-item" data-nav-action="battery" title="电源">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect><line x1="22" y1="11" x2="22" y2="13"></line>
          </svg>
        </div>
        <div class="dock-tray-item" id="dockTime" title="时间"></div>
        <div class="dock-tray-item dock-settings-btn" id="dockSettings" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </div>
        <div class="dock-tray-item dock-close" id="dockClose" title="关闭Dock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="dock-settings-panel" id="dockSettingsPanel">
    <div class="settings-header">
      <h3>Dock 设置</h3>
      <button class="settings-close" id="settingsClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="settings-content">
      <div class="settings-section">
        <div class="settings-title">常规</div>
        <label class="settings-item">
          <input type="checkbox" id="settingAlwaysOnTop">
          <span>始终置顶</span>
        </label>
        <label class="settings-item">
          <input type="checkbox" id="settingHideSystemTaskbar">
          <span>隐藏系统任务栏</span>
        </label>
      </div>
      <div class="settings-section">
        <div class="settings-title">外观</div>
        <div class="settings-slider-item">
          <div class="slider-label">
            <span>背景透明度</span>
            <span id="opacityValue">72%</span>
          </div>
          <input type="range" class="settings-slider" id="settingOpacity" min="10" max="100" value="72">
        </div>
        <div class="settings-slider-item">
          <div class="slider-label">
            <span>模糊强度</span>
            <span id="blurValue">30px</span>
          </div>
          <input type="range" class="settings-slider" id="settingBlur" min="0" max="60" value="30">
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-title">图标管理</div>
        <div class="settings-item">
          <button class="settings-btn" id="btnResetIcons">重置默认图标</button>
        </div>
        <div class="settings-item">
          <button class="settings-btn" id="btnShowHidden">显示隐藏的图标</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-title">关于</div>
        <div class="settings-info">版本 1.0.0</div>
        <div class="settings-info">浮窗文件管理器</div>
      </div>
    </div>
  </div>

  <script src="scripts/dock.js"></script>
</body>
</html>
