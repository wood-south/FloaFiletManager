<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Icon Helper</title>
</head>
<body>
  <script>
    window.electronAPI.onGetFileIcon((requestId, filePath, isDirectory) => {
      window.electronAPI.getFileIconNative(filePath, isDirectory)
        .then(dataUrl => {
          window.electronAPI.returnFileIcon(requestId, dataUrl);
        })
        .catch(() => {
          window.electronAPI.returnFileIcon(requestId, null);
        });
    });
  </script>
</body>
</html>
