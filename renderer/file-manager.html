<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文件管理</title>
    <link rel="stylesheet" href="styles/primitives.css" />
    <link rel="stylesheet" href="styles/file-manager.css" />
  </head>
  <body>
    <div class="fm-panel" id="fmPanel">
      <div class="fm-header">
        <div class="fm-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
            ></path>
          </svg>
          <span>文件管理</span>
        </div>
        <button class="close-btn" id="closeBtn">&times;</button>
      </div>

      <div class="fm-content">
        <div class="fm-sidebar" id="fmSidebar">
          <div class="sidebar-list" id="partitionList"></div>
          <div class="sidebar-bottom">
            <button class="sidebar-btn" id="addPartitionBtn" title="添加分区">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>新建分区</span>
            </button>
          </div>
        </div>

        <div class="fm-main">
          <div class="fm-toolbar">
            <div class="search-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="searchInput" placeholder="搜索文件..." />
            </div>
            <div class="view-switch">
              <button class="view-btn active" data-view="list" title="列表视图">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="8" y1="6" x2="21" y2="6"></line>
                  <line x1="8" y1="12" x2="21" y2="12"></line>
                  <line x1="8" y1="18" x2="21" y2="18"></line>
                  <line x1="3" y1="6" x2="3.01" y2="6"></line>
                  <line x1="3" y1="12" x2="3.01" y2="12"></line>
                  <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
              </button>
              <button class="view-btn" data-view="grid" title="图标视图">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
              </button>
            </div>
            <div class="upload-dropdown">
              <button class="upload-btn" id="uploadBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <span>上传</span>
              </button>
              <button class="upload-dropdown-btn" id="uploadDropdownBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>
              <div class="upload-dropdown-menu" id="uploadDropdownMenu">
                <div class="upload-dropdown-item" data-action="file">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                  </svg>
                  <span>上传文件</span>
                </div>
                <div class="upload-dropdown-item" data-action="folder">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                      d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
                    ></path>
                  </svg>
                  <span>上传文件夹</span>
                </div>
              </div>
            </div>
          </div>

          <div class="fm-path" id="pathBar">
            <button class="path-btn back-btn" id="backBtn" title="返回上一级">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <span class="path-text" id="pathText"></span>
            <button class="path-btn delete-btn" id="deleteBtn" title="删除选中文件" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path
                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                ></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>

          <div class="fm-body" id="fmBody">
            <div class="file-list" id="fileList"></div>
            <div class="empty-state" id="emptyState">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path
                  d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
                ></path>
              </svg>
              <p id="emptyText">暂无文件</p>
            </div>
          </div>

          <div class="fm-footer">
            <span id="fileCount">0 个文件</span>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-dialog">
        <div class="modal-icon" id="modalIcon"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-message" id="modalMessage"></div>
        <input type="text" class="modal-input" id="modalInput" style="display: none" />
        <div class="modal-buttons" id="modalButtons"></div>
      </div>
    </div>

    <div class="sidebar-context-menu" id="partitionContextMenu">
      <div class="ctx-item" data-action="addPath">添加路径</div>
      <div class="ctx-item" data-action="renamePartition">重命名分区</div>
      <div class="ctx-item danger" data-action="deletePartition">删除分区</div>
    </div>

    <div class="sidebar-context-menu" id="pathContextMenu">
      <div class="ctx-item" data-action="addToDock">添加到 Dock 栏</div>
      <div class="ctx-item" data-action="setPreferred">设为首选路径</div>
      <div class="ctx-item" data-action="renamePath">重命名</div>
      <div class="ctx-item danger" data-action="removePath">从分区移除</div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="scripts/primitives.js"></script>
    <script src="scripts/file-manager.js"></script>
  </body>
</html>
